[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chronotrace"
version = "0.1.0"
description = "Depurador con viaje en el tiempo y perfilador de ejecución para Python"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.110", "uvicorn>=0.27"]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "mypy>=1.10"]

[project.scripts]
chronotrace = "chronotrace.cli:main"

[tool.setuptools]
packages = ["chronotrace"]

[tool.setuptools.package-data]
chronotrace = ["ui/*", "py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.mypy]
packages = ["chronotrace"]
strict = true
